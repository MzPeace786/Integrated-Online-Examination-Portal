<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Administrator — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
  <div id="nav-placeholder"></div>
  <div class="container py-5 max-w-700 mx-auto">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <h3 class="fw-bold text-dark mb-1">Contact Administration</h3>
      <p class="text-muted small mb-4">Have questions regarding examinations, proctoring appeals, or privacy data requests?</p>
      <form onsubmit="event.preventDefault(); Utils.showToast('Your message has been sent to the examination controller.', 'success'); this.reset();">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Candidate Name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="email@university.edu" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" placeholder="Inquiry Subject" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Message Details</label>
          <textarea class="form-control" rows="4" placeholder="Describe your query or issue in detail..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4 fw-semibold" style="background:#4F46E5;">Send Message</button>
      </form>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script>
    fetch('/exam-portal/frontend/components/navbar.html').then(r=>r.text()).then(h=>document.getElementById('nav-placeholder').innerHTML=h);
    fetch('/exam-portal/frontend/components/footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-placeholder').innerHTML=h);
  </script>
</body>
</html>
