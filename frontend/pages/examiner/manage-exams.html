<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Examinations — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Manage Examinations</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/examiner/dashboard.html">Examiner</a></li>
              <li class="breadcrumb-item active">Manage Exams</li>
            </ol>
          </nav>
        </div>
      </div>
      <a href="/exam-portal/frontend/pages/examiner/create-exam.html" class="btn btn-primary btn-sm px-3 fw-semibold" style="background:#4F46E5;">
        <i class="bi bi-plus-lg me-1"></i> Create Exam
      </a>
    </header>

    <div class="content-area">
      <div class="ep-card">
        <div class="table-responsive">
          <table class="ep-table mb-0">
            <thead>
              <tr>
                <th>Title</th>
                <th>Subject</th>
                <th>Questions</th>
                <th>Enrolled</th>
                <th>Submissions</th>
                <th>Status</th>
                <th>Proctoring</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="manageExamsTbody">
              <tr><td colspan="8" class="text-center py-4 text-muted small">Loading examinations...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['examiner', 'admin']);
    Sidebar.load('examiner', 'manage-exams');

    document.addEventListener('DOMContentLoaded', loadExams);

    async function loadExams() {
      try {
        const resp = await ExamPortalAPI.examiner.getExams();
        const tbody = document.getElementById('manageExamsTbody');

        if (!resp.data || resp.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">No examinations found.</td></tr>';
          return;
        }

        tbody.innerHTML = resp.data.map(e => `
          <tr>
            <td class="fw-semibold text-dark">${e.title}</td>
            <td><span class="badge bg-light text-dark border">${e.subject_name || 'General'}</span></td>
            <td>${e.assigned_questions || e.total_questions || 0}</td>
            <td>${e.enrolled_count || 0}</td>
            <td>${e.submitted_count || 0}</td>
            <td>${Utils.getStatusBadge(e.status)}</td>
            <td>${e.proctoring_enabled == 1 ? '<span class="badge bg-danger">OpenCV Active</span>' : '<span class="badge bg-light text-muted border">Standard</span>'}</td>
            <td>
              <div class="d-flex gap-1">
                <a href="/exam-portal/frontend/pages/examiner/exam-attempts.html?id=${e.id}" class="btn btn-outline-primary btn-sm py-0 px-2" style="font-size:0.75rem;" title="View Student Attempts">Attempts</a>
                <a href="/exam-portal/frontend/pages/examiner/create-question.html?exam_id=${e.id}" class="btn btn-outline-success btn-sm py-0 px-2" style="font-size:0.75rem;" title="Add Questions">+Q</a>
                <button class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size:0.75rem;" onclick="deleteExam(${e.id})"><i class="bi bi-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        Utils.showToast(err.message || 'Error loading exams', 'error');
      }
    }

    async function deleteExam(id) {
      Utils.showConfirm('Delete Examination', 'Are you sure you want to delete this examination?', async () => {
        try {
          await ExamPortalAPI.examiner.deleteExam(id);
          Utils.showToast('Examination deleted', 'success');
          loadExams();
        } catch (err) {
          Utils.showToast(err.message || 'Error deleting exam', 'error');
        }
      });
    }
  </script>
</body>
</html>
