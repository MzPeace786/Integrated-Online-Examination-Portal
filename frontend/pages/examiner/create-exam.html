<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Examination — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Create New Examination</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/examiner/dashboard.html">Examiner</a></li>
              <li class="breadcrumb-item active">Create Exam</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area max-w-900 mx-auto">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <form id="createExamForm">
          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">1. Basic Information</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-8">
              <label class="form-label">Examination Title *</label>
              <input type="text" id="examTitle" class="form-control" placeholder="e.g. CS301 End-Semester Final Examination" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Subject</label>
              <select id="examSubject" class="form-select" required>
                <option value="1">Data Structures and Algorithms (CS301)</option>
                <option value="2">Database Management Systems (CS302)</option>
                <option value="3">Operating Systems (CS303)</option>
                <option value="4">Computer Networks (CS401)</option>
                <option value="6">Web Technologies (CS501)</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Description / Summary</label>
              <textarea id="examDesc" class="form-control" rows="2" placeholder="Brief context regarding syllabus and topics covered..."></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Candidate Instructions</label>
              <textarea id="examInstructions" class="form-control" rows="3" placeholder="Specific examination guidelines, anti-cheating disclaimers, etc."></textarea>
            </div>
          </div>

          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">2. Schedule, Duration & Marking</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label">Start Date & Time *</label>
              <input type="datetime-local" id="examStart" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">End Date & Time *</label>
              <input type="datetime-local" id="examEnd" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Duration (Minutes) *</label>
              <input type="number" id="examDuration" class="form-control" value="60" min="5" max="360" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Total Marks *</label>
              <input type="number" id="examTotalMarks" class="form-control" value="100" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Passing Percentage (%) *</label>
              <input type="number" id="examPassPct" class="form-control" value="40" min="1" max="100" required>
            </div>
          </div>

          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">3. Proctoring & Security Controls</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="form-check form-switch p-3 bg-light rounded-3 border">
                <input class="form-check-input ms-0 me-2" type="checkbox" id="proctoringEnabled" checked>
                <label class="form-check-label fw-bold text-dark" for="proctoringEnabled">
                  Enable OpenCV AI Webcam Proctoring
                </label>
                <div class="small text-muted mt-1">Monitors face presence, multiple faces, and looking away events.</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check form-switch p-3 bg-light rounded-3 border">
                <input class="form-check-input ms-0 me-2" type="checkbox" id="fullscreenRequired" checked>
                <label class="form-check-label fw-bold text-dark" for="fullscreenRequired">
                  Enforce Full-Screen Examination Mode
                </label>
                <div class="small text-muted mt-1">Logs tab departures and window blur instances.</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check form-switch p-3 bg-light rounded-3 border">
                <input class="form-check-input ms-0 me-2" type="checkbox" id="randomizeQuestions" checked>
                <label class="form-check-label fw-bold text-dark" for="randomizeQuestions">
                  Randomize Question Order
                </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check form-switch p-3 bg-light rounded-3 border">
                <input class="form-check-input ms-0 me-2" type="checkbox" id="randomizeOptions" checked>
                <label class="form-check-label fw-bold text-dark" for="randomizeOptions">
                  Randomize Multiple Choice Options
                </label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 pt-3 border-top">
            <a href="/exam-portal/frontend/pages/examiner/manage-exams.html" class="btn btn-outline-secondary px-3">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 fw-semibold" style="background:#4F46E5;">
              Create & Publish Examination
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['examiner', 'admin']);
    Sidebar.load('examiner', 'create-exam');

    // Default datetime helper
    const now = new Date();
    const later = new Date(Date.now() + 7 * 24 * 3600 * 1000);
    document.getElementById('examStart').value = now.toISOString().slice(0, 16);
    document.getElementById('examEnd').value = later.toISOString().slice(0, 16);

    document.getElementById('createExamForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const payload = {
          title: document.getElementById('examTitle').value.trim(),
          subject_id: parseInt(document.getElementById('examSubject').value),
          description: document.getElementById('examDesc').value.trim(),
          instructions: document.getElementById('examInstructions').value.trim(),
          start_datetime: document.getElementById('examStart').value.replace('T', ' ') + ':00',
          end_datetime: document.getElementById('examEnd').value.replace('T', ' ') + ':00',
          duration_minutes: parseInt(document.getElementById('examDuration').value),
          total_marks: parseFloat(document.getElementById('examTotalMarks').value),
          passing_percentage: parseFloat(document.getElementById('examPassPct').value),
          proctoring_enabled: document.getElementById('proctoringEnabled').checked ? 1 : 0,
          fullscreen_required: document.getElementById('fullscreenRequired').checked ? 1 : 0,
          random_questions: document.getElementById('randomizeQuestions').checked ? 1 : 0,
          random_options: document.getElementById('randomizeOptions').checked ? 1 : 0,
          status: 'active'
        };

        const resp = await ExamPortalAPI.examiner.createExam(payload);
        Utils.showToast('Examination created successfully!', 'success');
        setTimeout(() => {
          window.location.href = `/exam-portal/frontend/pages/examiner/question-bank.html?tab=ai&exam_id=${resp.data.exam_id}&subject_id=${payload.subject_id}`;
        }, 1000);
      } catch (err) {
        Utils.showToast(err.message || 'Error creating exam', 'error');
      }
    });
  </script>
</body>
</html>
