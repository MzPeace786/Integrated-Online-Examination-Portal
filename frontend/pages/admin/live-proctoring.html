<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Proctoring Monitor — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title d-flex align-items-center gap-2">
            <span class="spinner-grow spinner-grow-sm text-danger" role="status"></span>
            <span>Live OpenCV Proctoring Center</span>
          </h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/admin/dashboard.html">Admin</a></li>
              <li class="breadcrumb-item active">Live Monitor</li>
            </ol>
          </nav>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-muted">Auto-refresh in <strong id="refreshCountdown">10</strong>s</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadLiveSessions()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
    </header>

    <div class="content-area">
      <!-- Active Sessions Status Header -->
      <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h5 class="fw-bold text-dark mb-1">Active Candidate Sessions</h5>
            <div class="text-muted small">Live stream metrics and AI risk ratings computed across connected webcams.</div>
          </div>
          <div class="d-flex gap-3">
            <div class="text-center">
              <div class="fw-bold fs-4 text-primary" id="activeCount">0</div>
              <div class="text-muted small">Candidates Online</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Cards Grid -->
      <div class="row g-4" id="liveGrid">
        <div class="col-12 text-center py-5 text-muted">Scanning active examination sessions...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['admin', 'examiner']);
    Sidebar.load('admin', 'live-proctoring');

    let countdown = 10;
    let countdownInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadLiveSessions();
      startAutoRefresh();
    });

    function startAutoRefresh() {
      countdown = 10;
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdown--;
        document.getElementById('refreshCountdown').textContent = countdown;
        if (countdown <= 0) {
          countdown = 10;
          loadLiveSessions();
        }
      }, 1000);
    }

    async function loadLiveSessions() {
      const grid = document.getElementById('liveGrid');
      try {
        const resp = await ExamPortalAPI.proctoring.getLive();
        const sessions = resp.data.active_sessions || resp.data.active_students || [];
        document.getElementById('activeCount').textContent = sessions.length;

        if (sessions.length === 0) {
          const recent = resp.data.recent_sessions || [];
          let recentHtml = '';
          if (recent.length > 0) {
            recentHtml = `
              <div class="mt-4 text-start">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h6 class="fw-bold text-dark mb-0"><i class="bi bi-clock-history me-2"></i>Recent Completed Sessions (${recent.length})</h6>
                  <a href="/exam-portal/frontend/pages/admin/proctoring-reports.html" class="btn btn-outline-primary btn-sm">View Full Audit Ledger &rarr;</a>
                </div>
                <div class="row g-3">
                  ${recent.slice(0, 6).map(r => `
                    <div class="col-md-6 col-lg-4">
                      <div class="card border rounded-3 p-3 bg-white shadow-sm h-100">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                          <span class="fw-bold text-dark">${r.student_name}</span>
                          <span class="badge bg-secondary">COMPLETED</span>
                        </div>
                        <div class="small text-muted mb-2">Exam: ${r.exam_title}</div>
                        <div class="d-flex justify-content-between align-items-center">
                          <span class="small text-muted">Risk Score:</span>
                          <span class="fw-bold ${r.risk_score >= 60 ? 'text-danger' : (r.risk_score >= 30 ? 'text-warning' : 'text-success')}">${r.risk_score || 0} / 100</span>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }

          grid.innerHTML = `
            <div class="col-12 text-center py-4">
              <i class="bi bi-camera-video text-muted display-4 mb-2 d-block"></i>
              <h5 class="text-muted mb-1">No Active Candidates Currently in Exam</h5>
              <p class="small text-muted max-w-600 mx-auto">When candidates start an active exam with camera proctoring enabled, their live feed telemetry and OpenCV metrics will appear here in real time.</p>
              ${recentHtml}
            </div>`;
          return;
        }

        grid.innerHTML = sessions.map(s => {
          const riskCls = s.risk_score >= 60 ? 'border-danger' : (s.risk_score >= 30 ? 'border-warning' : 'border-success');
          return `
            <div class="col-md-6 col-lg-4">
              <div class="card border ${riskCls} shadow-sm rounded-4 overflow-hidden h-100">
                <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
                  <div class="fw-bold text-truncate">${s.student_name}</div>
                  <span class="badge ${s.camera_status === 'active' ? 'bg-success' : 'bg-danger'}">
                    <i class="bi bi-camera-fill me-1"></i>${(s.camera_status || 'active').toUpperCase()}
                  </span>
                </div>
                <div class="card-body p-3">
                  <div class="small text-muted mb-2">Exam: <strong class="text-dark">${s.exam_title}</strong></div>
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="small text-muted">AI Risk Assessment:</div>
                    ${Utils.getRiskBadge(s.risk_level || 'normal')}
                  </div>
                  <div class="p-2 bg-light rounded-3 text-center border">
                    <div class="small text-muted">Risk Score</div>
                    <div class="fw-bold fs-4 ${s.risk_score >= 60 ? 'text-danger' : 'text-primary'}">${s.risk_score || 0} / 100</div>
                  </div>
                </div>
                <div class="card-footer bg-white border-top p-2 text-center">
                  <a href="/exam-portal/frontend/pages/admin/proctoring-reports.html?session_id=${s.id || s.session_id}" class="btn btn-outline-primary btn-sm w-100 py-1" style="font-size:0.78rem;">
                    Inspect Event Timeline &rarr;
                  </a>
                </div>
              </div>
            </div>`;
        }).join('');

      } catch (err) {
        grid.innerHTML = `<div class="col-12 text-center text-danger py-4">${err.message || 'Error'}</div>`;
      }
    }
  </script>
</body>
</html>
