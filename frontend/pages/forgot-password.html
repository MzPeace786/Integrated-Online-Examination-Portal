<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="nav-placeholder"></div>

  <div class="container my-auto py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 max-w-500 mx-auto bg-white">
      <div class="text-center mb-4">
        <div class="stat-card-icon mx-auto mb-3 bg-primary-subtle text-primary">
          <i class="bi bi-key-fill"></i>
        </div>
        <h4 class="fw-bold text-dark">Forgot Password?</h4>
        <p class="text-muted small">Enter your email address and we'll send a secure password reset link.</p>
      </div>

      <div id="alertBox" class="alert d-none py-2 px-3 small"></div>

      <form id="forgotForm">
        <div class="mb-3">
          <label class="form-label">Account Email</label>
          <input type="email" id="email" class="form-control" placeholder="user@university.edu" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="submitBtn" style="background:#4F46E5;">
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
          <span>Send Reset Link</span>
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <a href="/exam-portal/frontend/pages/login.html" class="small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Back to Sign In
        </a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script>
    fetch('/exam-portal/frontend/components/navbar.html').then(r=>r.text()).then(h=>document.getElementById('nav-placeholder').innerHTML=h);
    fetch('/exam-portal/frontend/components/footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-placeholder').innerHTML=h);

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('btnSpinner');

      alertBox.className = 'alert d-none py-2 px-3 small';
      submitBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const resp = await ExamPortalAPI.auth.forgotPassword(email);
        alertBox.className = 'alert alert-success py-2 px-3 small';
        alertBox.textContent = resp.message || 'If an account exists with that email, a password reset link has been dispatched.';
        alertBox.classList.remove('d-none');
      } catch (err) {
        alertBox.className = 'alert alert-danger py-2 px-3 small';
        alertBox.textContent = err.message || 'Unable to process request.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
