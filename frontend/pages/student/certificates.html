<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Earned Certificates</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/student/dashboard.html">Dashboard</a></li>
              <li class="breadcrumb-item active">Certificates</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="row g-4" id="certificatesGrid">
        <div class="col-12 text-center py-5 text-muted">Loading your earned certificates...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['student']);
    Sidebar.load('student', 'certificates');

    document.addEventListener('DOMContentLoaded', loadCertificates);

    async function loadCertificates() {
      const grid = document.getElementById('certificatesGrid');
      try {
        const resp = await ExamPortalAPI.student.getCertificates();
        const certs = resp.data;

        if (!certs || certs.length === 0) {
          grid.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-award text-muted display-3 mb-3 d-block"></i>
              <h5 class="text-muted">No certificates earned yet</h5>
              <p class="small text-muted">Score above the required passing percentage on enrolled exams to generate certificates.</p>
            </div>`;
          return;
        }

        grid.innerHTML = certs.map(c => `
          <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
              <div class="p-3 bg-primary text-white d-flex align-items-center gap-2">
                <i class="bi bi-patch-check-fill fs-4"></i>
                <div class="text-truncate fw-semibold small">Certificate of Achievement</div>
              </div>
              <div class="card-body p-4 d-flex flex-column justify-content-between">
                <div>
                  <h5 class="fw-bold text-dark mb-2">${c.exam_name}</h5>
                  <div class="badge bg-light text-dark border mb-3">${c.subject_name || 'General Subject'}</div>
                  <div class="small text-muted mb-1">Percentage: <strong class="text-success">${c.percentage}%</strong></div>
                  <div class="small text-muted mb-3">Issued: ${Utils.formatDate(c.issued_at)}</div>
                  <div class="small text-muted font-monospace border rounded p-2 bg-light text-break">
                    ${c.certificate_number}
                  </div>
                </div>
                <div class="d-flex gap-2 mt-4 pt-3 border-top">
                  <a href="/exam-portal/backend/api/student/certificates/${c.id}/download?token=${encodeURIComponent(Auth.getToken())}" target="_blank" class="btn btn-success btn-sm w-100 fw-semibold">
                    <i class="bi bi-printer me-1"></i> Print / Download
                  </a>
                  <button class="btn btn-outline-secondary btn-sm" onclick="Utils.copyToClipboard('${c.qr_code_data}')" title="Copy Verification Link">
                    <i class="bi bi-share"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<div class="col-12 text-center text-danger py-5">${err.message || 'Error loading certificates'}</div>`;
      }
    }
  </script>
</body>
</html>
