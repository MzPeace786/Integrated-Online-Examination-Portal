<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Settings — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Global System Settings</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/admin/dashboard.html">Admin</a></li>
              <li class="breadcrumb-item active">Settings</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area max-w-900 mx-auto">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div id="settingsContainer" class="d-flex flex-column gap-3">
          <div class="text-center py-4 text-muted small">Loading system parameters...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['admin']);
    Sidebar.load('admin', 'settings');

    document.addEventListener('DOMContentLoaded', loadSettings);

    async function loadSettings() {
      try {
        const resp = await ExamPortalAPI.admin.getSettings();
        const c = document.getElementById('settingsContainer');

        c.innerHTML = resp.data.map(s => `
          <div class="p-3 bg-light rounded-3 border d-flex justify-content-between align-items-center">
            <div>
              <div class="fw-bold text-dark text-capitalize">${s.setting_key.replace(/_/g, ' ')}</div>
              <div class="small text-muted">${s.description || ''}</div>
            </div>
            <div class="d-flex gap-2 align-items-center">
              <input type="text" class="form-control form-control-sm" style="width:200px;" id="input_${s.setting_key}" value="${s.setting_value}">
              <button class="btn btn-primary btn-sm px-3" onclick="saveSetting('${s.setting_key}')" style="background:#4F46E5;">Save</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        Utils.showToast(err.message || 'Error loading settings', 'error');
      }
    }

    async function saveSetting(key) {
      const val = document.getElementById(`input_${key}`).value.trim();
      try {
        await ExamPortalAPI.admin.updateSetting(key, val);
        Utils.showToast(`Updated ${key}`, 'success');
      } catch (err) {
        Utils.showToast(err.message || 'Error updating setting', 'error');
      }
    }
  </script>
</body>
</html>
