<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Event Logs — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Security Events & Alerts</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/admin/dashboard.html">Admin</a></li>
              <li class="breadcrumb-item active">Security Logs</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="ep-card">
        <div class="table-responsive">
          <table class="ep-table mb-0">
            <thead>
              <tr>
                <th>Event Type</th>
                <th>Origin IP</th>
                <th>Target User</th>
                <th>Details</th>
                <th>Timestamp</th>
              </tr>
            </thead>
            <tbody id="secTbody">
              <tr><td colspan="5" class="text-center py-4 text-muted small">Loading security logs...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['admin']);
    Sidebar.load('admin', 'security-logs');

    document.addEventListener('DOMContentLoaded', loadSecLogs);

    async function loadSecLogs() {
      try {
        const resp = await ExamPortalAPI.admin.getSecurityLogs();
        const tbody = document.getElementById('secTbody');

        tbody.innerHTML = resp.data.map(s => `
          <tr>
            <td class="fw-semibold text-danger">${s.event_type}</td>
            <td><code>${s.ip_address}</code></td>
            <td>${s.email || 'Anonymous / Guest'}</td>
            <td class="small text-muted font-monospace">${s.details || '—'}</td>
            <td class="small text-muted">${Utils.formatDateTime(s.created_at)}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" class="text-center py-4 text-muted">No security events found.</td></tr>';
      } catch (err) {
        Utils.showToast(err.message || 'Error loading security logs', 'error');
      }
    }
  </script>
</body>
</html>
