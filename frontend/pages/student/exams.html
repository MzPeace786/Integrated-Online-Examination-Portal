<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Examinations — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn">
          <i class="bi bi-list fs-4"></i>
        </button>
        <div>
          <h1 class="page-title">Enrolled Examinations</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/student/dashboard.html">Dashboard</a></li>
              <li class="breadcrumb-item active">Examinations</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area">
      <!-- Filter Bar -->
      <div class="ep-card mb-4">
        <div class="ep-card-body p-3">
          <div class="row g-2 align-items-center">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by exam title or subject...">
              </div>
            </div>
            <div class="col-md-4">
              <select id="statusFilter" class="form-select">
                <option value="">All Statuses</option>
                <option value="active">Active Now</option>
                <option value="scheduled">Scheduled / Upcoming</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100 fw-semibold" onclick="loadExams()" style="background:#4F46E5;">Filter</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Exams Grid -->
      <div class="row g-4" id="examsGrid">
        <div class="col-12 text-center py-5 text-muted">Loading your enrolled examinations...</div>
      </div>

      <div class="mt-4" id="paginationContainer"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['student']);
    Sidebar.load('student', 'exams');

    document.addEventListener('DOMContentLoaded', loadExams);

    async function loadExams(page = 1) {
      const grid = document.getElementById('examsGrid');
      const search = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('statusFilter').value;

      try {
        const resp = await ExamPortalAPI.student.getExams({ page, search, status });
        const exams = resp.data;

        if (!exams || exams.length === 0) {
          grid.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-journal-x display-4 text-muted mb-3 d-block"></i>
              <h5 class="text-muted">No examinations match your criteria</h5>
            </div>`;
          return;
        }

        grid.innerHTML = exams.map(e => {
          const isProctored = e.proctoring_enabled == 1;
          const statusBadge = Utils.getStatusBadge(e.status);
          const attemptsLeft = e.allowed_attempts - (e.attempts_used || 0);

          return `
            <div class="col-md-6 col-lg-4">
              <div class="exam-card h-100 d-flex flex-column">
                <div class="exam-card-body flex-grow-1">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge bg-light text-dark border">${e.subject_name || 'General'}</span>
                    ${statusBadge}
                  </div>
                  <h5 class="exam-card-title">${e.title}</h5>
                  <p class="small text-muted mb-3" style="min-height:38px;">${e.description ? e.description.substring(0, 90) + '...' : 'Institutional assessment.'}</p>
                  
                  <div class="d-flex flex-column gap-2 small text-muted">
                    <div><i class="bi bi-clock me-2 text-primary"></i>Duration: <strong>${e.duration_minutes} mins</strong></div>
                    <div><i class="bi bi-calendar-event me-2 text-primary"></i>Window: ${Utils.formatDateTime(e.start_datetime)}</div>
                    <div><i class="bi bi-check2-circle me-2 text-primary"></i>Passing Mark: <strong>${e.passing_percentage}%</strong></div>
                    ${isProctored ? '<div class="text-danger fw-semibold"><i class="bi bi-camera-video-fill me-2"></i>OpenCV AI Proctoring Active</div>' : '<div class="text-muted"><i class="bi bi-shield me-2"></i>Standard Web Mode</div>'}
                  </div>
                </div>
                <div class="exam-card-footer">
                  <span class="small text-muted">Attempts left: <strong>${Math.max(0, attemptsLeft)}</strong></span>
                  <a href="/exam-portal/frontend/pages/student/exam-instructions.html?id=${e.id}" class="btn btn-primary btn-sm px-3 fw-semibold" style="background:#4F46E5;">
                    View Instructions &rarr;
                  </a>
                </div>
              </div>
            </div>`;
        }).join('');

        if (resp.pagination) {
          Utils.renderPagination('paginationContainer', resp.pagination.total, page, resp.pagination.per_page, loadExams);
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-danger">${err.message || 'Error loading exams'}</div>`;
      }
    }
  </script>
</body>
</html>
