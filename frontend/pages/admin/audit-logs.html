<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Audit Logs — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Compliance Audit Trail</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/admin/dashboard.html">Admin</a></li>
              <li class="breadcrumb-item active">Audit Logs</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="ep-card">
        <div class="table-responsive">
          <table class="ep-table mb-0">
            <thead>
              <tr>
                <th>Action</th>
                <th>Entity</th>
                <th>User</th>
                <th>IP Address</th>
                <th>Status</th>
                <th>Timestamp</th>
              </tr>
            </thead>
            <tbody id="auditTbody">
              <tr><td colspan="6" class="text-center py-4 text-muted small">Loading audit logs...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['admin']);
    Sidebar.load('admin', 'audit-logs');

    document.addEventListener('DOMContentLoaded', loadAuditLogs);

    async function loadAuditLogs() {
      try {
        const resp = await ExamPortalAPI.admin.getAuditLogs();
        const tbody = document.getElementById('auditTbody');

        if (!resp.data || resp.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">No audit logs recorded yet.</td></tr>';
          return;
        }

        tbody.innerHTML = resp.data.map(l => `
          <tr>
            <td class="fw-semibold text-dark">${l.action}</td>
            <td><span class="badge bg-light text-dark border">${l.entity_type || '—'}</span></td>
            <td>${l.email || 'System'}</td>
            <td><code>${l.ip_address || '—'}</code></td>
            <td><span class="badge bg-success-subtle text-success">${l.status}</span></td>
            <td class="small text-muted">${Utils.formatDateTime(l.created_at)}</td>
          </tr>
        `).join('');
      } catch (err) {
        Utils.showToast(err.message || 'Error loading audit logs', 'error');
      }
    }
  </script>
</body>
</html>
