<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Question — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body class="bg-light">

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Add Question to Bank</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/examiner/dashboard.html">Examiner</a></li>
              <li class="breadcrumb-item active">Add Question</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area max-w-900 mx-auto">
      
      <!-- AI Question Bank Banner -->
      <div class="alert alert-primary d-flex align-items-center justify-content-between p-3 mb-4 rounded-4 border-0 shadow-sm bg-primary bg-opacity-10">
        <div class="d-flex align-items-center gap-3">
          <div class="p-2 bg-primary text-white rounded-3 fs-4"><i class="bi bi-magic"></i></div>
          <div>
            <div class="fw-bold text-dark">Need Multiple Questions Generated Automatically?</div>
            <div class="small text-muted">Use our Automated Question Bank to synthesize 5 to 20 questions based on Subject & Topics instantly.</div>
          </div>
        </div>
        <a href="/exam-portal/frontend/pages/examiner/question-bank.html?tab=ai" class="btn btn-primary btn-sm px-3 py-2 fw-bold text-nowrap" style="background:#4F46E5;">
          <i class="bi bi-magic me-1"></i> Auto Question Bank
        </a>
      </div>

      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <form id="createQuestionForm">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold">Question Type</label>
              <select id="questionType" class="form-select" onchange="renderAnswerInputs()">
                <option value="mcq">Single Choice MCQ</option>
                <option value="multiple_correct">Multiple Correct Answers</option>
                <option value="true_false">True / False</option>
                <option value="fill_blank">Fill in the Blank</option>
                <option value="short_answer">Short Answer / Subjective</option>
                <option value="coding">Programming / Coding Assessment</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Subject</label>
              <select id="questionSubject" class="form-select">
                <option value="1">Data Structures and Algorithms (CS301)</option>
                <option value="2">Database Management Systems (CS302)</option>
                <option value="3">Operating Systems (CS303)</option>
                <option value="4">Computer Networks (CS401)</option>
                <option value="5">Software Engineering (CS402)</option>
                <option value="6">Web Technologies (CS501)</option>
                <option value="7">Artificial Intelligence (CS601)</option>
                <option value="10">Discrete Mathematics (MA201)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Topic / Unit</label>
              <input type="text" id="questionTopic" class="form-control" placeholder="e.g. Binary Search Trees, Normalization, Deadlocks">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Difficulty</label>
              <select id="questionDifficulty" class="form-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Marks</label>
              <input type="number" id="questionMarks" class="form-control" value="1.0" step="0.5" min="0.5" required>
            </div>

            <!-- Question Statement with AI Suggest Button -->
            <div class="col-12">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-bold mb-0">Question Text (HTML / Markdown supported) *</label>
                <button type="button" class="btn btn-outline-primary btn-sm py-0 px-2 fw-semibold" onclick="suggestQuestionForCurrentForm()">
                  <i class="bi bi-magic me-1"></i> Suggest Question for Subject
                </button>
              </div>
              <textarea id="questionText" class="form-control" rows="4" placeholder="Enter problem statement or click 'Suggest Question'..." required></textarea>
            </div>
          </div>

          <h5 class="fw-bold text-dark mb-3 border-top pt-3">Answer & Evaluation Parameters</h5>
          
          <div id="dynamicAnswerSection" class="mb-4">
            <!-- Dynamic inputs based on type -->
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Detailed Solution Explanation</label>
            <textarea id="questionExplanation" class="form-control" rows="2" placeholder="Explain the rationale behind the correct answer..."></textarea>
          </div>

          <div class="d-flex justify-content-between align-items-center pt-3 border-top">
            <a href="/exam-portal/frontend/pages/examiner/question-bank.html?tab=ai" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-magic me-1"></i> Open Batch Generator
            </a>
            <button type="submit" class="btn btn-primary px-4 fw-semibold" style="background:#4F46E5;">
              Save Question to Bank
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['examiner', 'admin']);
    Sidebar.load('examiner', 'create-question');

    const urlExamId = Utils.getQueryParam('exam_id');
    const urlSubjectId = Utils.getQueryParam('subject_id');

    document.addEventListener('DOMContentLoaded', () => {
      renderAnswerInputs();
      if (urlSubjectId) {
        document.getElementById('questionSubject').value = urlSubjectId;
      }
    });

    async function suggestQuestionForCurrentForm() {
      const subSelect = document.getElementById('questionSubject');
      const subjectName = subSelect ? subSelect.options[subSelect.selectedIndex].text : '';
      const topic = document.getElementById('questionTopic').value.trim();
      const qType = document.getElementById('questionType').value;
      const difficulty = document.getElementById('questionDifficulty').value;

      Utils.showLoading('Synthesizing question for ' + subjectName + '...');
      try {
        const resp = await ExamPortalAPI.examiner.suggestQuestions({
          subject_name: subjectName,
          topic: topic,
          question_type: (qType === 'multiple_correct' ? 'mcq' : qType),
          difficulty: difficulty,
          count: 1
        });

        if (resp.data && resp.data.length > 0) {
          const q = resp.data[0];
          document.getElementById('questionText').value = q.question_text.replace(/<[^>]*>?/gm, '');
          if (q.explanation) document.getElementById('questionExplanation').value = q.explanation;
          if (q.marks) document.getElementById('questionMarks').value = q.marks;

          // Fill options
          if ((qType === 'mcq' || qType === 'multiple_correct') && q.options) {
            renderAnswerInputs();
            setTimeout(() => {
              const textInputs = document.querySelectorAll('.opt-text');
              const radios = document.querySelectorAll('input[name="correctChoice"]');
              q.options.forEach((opt, idx) => {
                if (textInputs[idx]) textInputs[idx].value = opt.text || opt.option_text || '';
                if (radios[idx]) radios[idx].checked = opt.is_correct ? true : false;
              });
            }, 50);
          } else if (qType === 'true_false' && q.options) {
            renderAnswerInputs();
            setTimeout(() => {
              const corr = q.options.find(o => o.is_correct);
              const isTrue = corr ? String(corr.text).toLowerCase().includes('true') : true;
              const r = document.getElementById(isTrue ? 'tfTrue' : 'tfFalse');
              if (r) r.checked = true;
            }, 50);
          } else if (qType === 'coding' && q.test_cases && q.test_cases.length > 0) {
            renderAnswerInputs();
            setTimeout(() => {
              const tc = q.test_cases[0];
              const tcIn = document.getElementById('tcInput');
              const tcOut = document.getElementById('tcOutput');
              if (tcIn) tcIn.value = tc.input || tc.input_data || '';
              if (tcOut) tcOut.value = tc.output || tc.expected_output || '';
            }, 50);
          }

          Utils.showToast('Question suggested and populated!', 'success');
        }
      } catch (err) {
        Utils.showToast(err.message || 'Error suggesting question', 'error');
      } finally {
        Utils.hideLoading();
      }
    }

    function renderAnswerInputs() {
      const type = document.getElementById('questionType').value;
      const sec = document.getElementById('dynamicAnswerSection');

      if (type === 'mcq' || type === 'multiple_correct') {
        sec.innerHTML = `
          <div class="d-flex flex-column gap-2" id="optionsList">
            <div class="input-group">
              <div class="input-group-text"><input type="${type === 'mcq' ? 'radio' : 'checkbox'}" name="correctChoice" value="0" checked></div>
              <input type="text" class="form-control opt-text" placeholder="Option A" required>
            </div>
            <div class="input-group">
              <div class="input-group-text"><input type="${type === 'mcq' ? 'radio' : 'checkbox'}" name="correctChoice" value="1"></div>
              <input type="text" class="form-control opt-text" placeholder="Option B" required>
            </div>
            <div class="input-group">
              <div class="input-group-text"><input type="${type === 'mcq' ? 'radio' : 'checkbox'}" name="correctChoice" value="2"></div>
              <input type="text" class="form-control opt-text" placeholder="Option C" required>
            </div>
            <div class="input-group">
              <div class="input-group-text"><input type="${type === 'mcq' ? 'radio' : 'checkbox'}" name="correctChoice" value="3"></div>
              <input type="text" class="form-control opt-text" placeholder="Option D" required>
            </div>
          </div>
          <small class="text-muted mt-2 d-block"><i class="bi bi-info-circle me-1"></i>Select the radio/checkbox next to the correct answer choice.</small>`;
      } else if (type === 'true_false') {
        sec.innerHTML = `
          <div class="d-flex gap-4">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tfChoice" id="tfTrue" value="True" checked>
              <label class="form-check-label fw-bold text-success" for="tfTrue">True</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tfChoice" id="tfFalse" value="False">
              <label class="form-check-label fw-bold text-danger" for="tfFalse">False</label>
            </div>
          </div>`;
      } else if (type === 'coding') {
        sec.innerHTML = `
          <div class="p-3 bg-light rounded-3 border mb-3">
            <h6 class="fw-bold small text-dark mb-2">Automated Test Case (Input & Expected Output)</h6>
            <div class="row g-2 mb-2">
              <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="tcInput" placeholder="Standard Input (e.g. 5 10)"></div>
              <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="tcOutput" placeholder="Expected Output (e.g. 15)" required></div>
            </div>
          </div>`;
      } else {
        sec.innerHTML = `<input type="text" class="form-control" id="fillCorrectAnswer" placeholder="Accepted exact text answer...">`;
      }
    }

    document.getElementById('createQuestionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('questionType').value;

      let options = [];
      let test_cases = [];

      if (type === 'mcq' || type === 'multiple_correct') {
        const texts = document.querySelectorAll('.opt-text');
        const radios = document.querySelectorAll('input[name="correctChoice"]');
        texts.forEach((inp, idx) => {
          options.push({
            text: inp.value.trim(),
            is_correct: radios[idx].checked ? 1 : 0
          });
        });
      } else if (type === 'true_false') {
        const isTrue = document.getElementById('tfTrue').checked;
        options = [
          { text: 'True', is_correct: isTrue ? 1 : 0 },
          { text: 'False', is_correct: !isTrue ? 1 : 0 }
        ];
      } else if (type === 'coding') {
        test_cases = [{
          input_data: document.getElementById('tcInput')?.value || '',
          expected_output: document.getElementById('tcOutput')?.value || '',
          marks: parseFloat(document.getElementById('questionMarks').value)
        }];
      }

      const payload = {
        question_type: type,
        subject_id: parseInt(document.getElementById('questionSubject').value),
        topic: document.getElementById('questionTopic').value.trim(),
        difficulty: document.getElementById('questionDifficulty').value,
        marks: parseFloat(document.getElementById('questionMarks').value),
        question_text: document.getElementById('questionText').value.trim(),
        explanation: document.getElementById('questionExplanation').value.trim(),
        options,
        test_cases,
        exam_id: urlExamId ? parseInt(urlExamId) : null
      };

      try {
        const resp = await ExamPortalAPI.examiner.createQuestion(payload);
        Utils.showToast('Question created and added successfully!', 'success');
        document.getElementById('createQuestionForm').reset();
        renderAnswerInputs();
      } catch (err) {
        Utils.showToast(err.message || 'Error creating question', 'error');
      }
    });
  </script>
</body>
</html>
