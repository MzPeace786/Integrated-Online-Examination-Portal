<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="nav-placeholder"></div>

  <div class="container my-auto py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 max-w-500 mx-auto bg-white">
      <div class="text-center mb-4">
        <h4 class="fw-bold text-dark">Set New Password</h4>
        <p class="text-muted small">Choose a strong password with letters, digits, and special characters.</p>
      </div>

      <div id="alertBox" class="alert d-none py-2 px-3 small"></div>

      <form id="resetForm">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="submitBtn" style="background:#4F46E5;">
          <span>Reset Password</span>
        </button>
      </form>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script>
    fetch('/exam-portal/frontend/components/navbar.html').then(r=>r.text()).then(h=>document.getElementById('nav-placeholder').innerHTML=h);
    fetch('/exam-portal/frontend/components/footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-placeholder').innerHTML=h);

    const token = Utils.getQueryParam('token');
    if (!token) {
      document.getElementById('alertBox').className = 'alert alert-danger py-2 px-3 small';
      document.getElementById('alertBox').textContent = 'Invalid or missing password reset token.';
      document.getElementById('alertBox').classList.remove('d-none');
      document.getElementById('submitBtn').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const cp = document.getElementById('confirmPassword').value;
      const alertBox = document.getElementById('alertBox');

      if (pw !== cp) {
        Utils.showToast('Passwords do not match.', 'error');
        return;
      }

      try {
        const resp = await ExamPortalAPI.auth.resetPassword(token, pw, cp);
        alertBox.className = 'alert alert-success py-2 px-3 small';
        alertBox.textContent = resp.message || 'Password reset successfully! Redirecting to login...';
        alertBox.classList.remove('d-none');
        setTimeout(() => { window.location.href = '/exam-portal/frontend/pages/login.html'; }, 1500);
      } catch (err) {
        alertBox.className = 'alert alert-danger py-2 px-3 small';
        alertBox.textContent = err.message || 'Password reset failed.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
