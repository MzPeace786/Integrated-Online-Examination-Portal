<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Deletion & Privacy Requests — ExamPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/exam-portal/frontend/public/css/style.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn d-lg-none" id="mobileMenuBtn"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Candidate Data Deletion & Privacy Ledger</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/exam-portal/frontend/pages/admin/dashboard.html">Admin</a></li>
              <li class="breadcrumb-item active">Deletion Requests</li>
            </ol>
          </nav>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="ep-card">
        <div class="table-responsive">
          <table class="ep-table mb-0">
            <thead>
              <tr>
                <th>Candidate</th>
                <th>Request Type</th>
                <th>Justification</th>
                <th>Status</th>
                <th>Requested At</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="delReqTbody">
              <tr><td colspan="6" class="text-center py-4 text-muted small">Loading privacy requests...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/exam-portal/frontend/public/js/api.js"></script>
  <script src="/exam-portal/frontend/public/js/auth.js"></script>
  <script src="/exam-portal/frontend/public/js/utils.js"></script>
  <script src="/exam-portal/frontend/public/js/sidebar.js"></script>
  <script>
    Auth.requireAuth(['admin']);
    Sidebar.load('admin', 'deletion-requests');

    document.addEventListener('DOMContentLoaded', loadDeletionRequests);

    async function loadDeletionRequests() {
      try {
        const resp = await ExamPortalAPI.admin.getDeletionRequests();
        const tbody = document.getElementById('delReqTbody');

        if (!resp.data || resp.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">No pending privacy or deletion requests.</td></tr>';
          return;
        }

        tbody.innerHTML = resp.data.map(r => `
          <tr>
            <td class="fw-semibold text-dark">${r.student_name || 'Candidate'} <br><small class="text-muted">${r.email}</small></td>
            <td class="text-capitalize"><code>${r.request_type.replace(/_/g, ' ')}</code></td>
            <td class="small text-muted">${r.reason || 'None specified'}</td>
            <td><span class="badge ${r.status === 'pending' ? 'bg-warning text-dark' : (r.status === 'completed' ? 'bg-success' : 'bg-danger')}">${r.status.toUpperCase()}</span></td>
            <td class="small text-muted">${Utils.formatDateTime(r.requested_at)}</td>
            <td>
              ${r.status === 'pending' ? `
                <button class="btn btn-outline-success btn-sm py-0 px-2" style="font-size:0.75rem;" onclick="processReq(${r.id}, 'completed')">Approve & Purge</button>
                <button class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size:0.75rem;" onclick="processReq(${r.id}, 'rejected')">Reject</button>
              ` : '<span class="text-muted small">Processed</span>'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        Utils.showToast(err.message || 'Error loading requests', 'error');
      }
    }

    async function processReq(id, status) {
      try {
        await ExamPortalAPI.admin.processDeletion(id, { status, notes: `Processed by administrator on ${new Date().toISOString()}` });
        Utils.showToast(`Request marked as ${status}`, 'success');
        loadDeletionRequests();
      } catch (err) {
        Utils.showToast(err.message || 'Error', 'error');
      }
    }
  </script>
</body>
</html>
